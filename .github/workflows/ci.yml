name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gates (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Show uv version
        run: uv --version

      - name: Lock consistency
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff lint
        run: uv run ruff check src tests scripts --output-format=github

      - name: Ruff format
        run: uv run ruff format --check --respect-gitignore src tests scripts

      - name: Mypy (strict)
        run: uv run mypy src tests scripts

      - name: Pytest (with branch coverage)
        run: |
          uv run pytest \
            --cov=flight_agent_evaluator \
            --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-fail-under=90

      - name: Build (wheel + sdist)
        run: uv build

      - name: Inspect wheel
        run: uv run python scripts/check.py wheel

      - name: Inspect sdist
        run: uv run python scripts/check.py sdist

      - name: Isolated wheel installation
        run: uv run python scripts/check.py install-wheel

      - name: Verify package import
        run: uv run python scripts/check.py import

      - name: Verify fixture loading from installed wheel
        run: uv run python scripts/check.py fixtures

      - name: Verify py.typed present
        run: uv run python scripts/check.py pytyped

      - name: Validate README
        run: uv run python scripts/check.py readme

      - name: Deterministic fixture smoke test
        run: uv run python scripts/check.py smoke
