name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Git Bash on Windows runners, so every step uses identical syntax on all OSes.
    shell: bash

jobs:
  quality:
    name: Quality Gates (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.11"
    env:
      # Overrides the .python-version pin for every uv command (sync, run, build).
      # Without this, `uv sync` silently selects 3.11 for every matrix entry.
      UV_PYTHON: ${{ matrix.python-version }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Show uv version
        run: uv --version

      - name: No committed secrets or key files
        run: uv run --no-project python scripts/check.py no-secrets

      - name: Lock consistency
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      - name: Assert interpreter matches matrix
        run: |
          uv run python --version
          uv run python -c "import sys; actual = '%d.%d' % sys.version_info[:2]; expected = '${{ matrix.python-version }}'; assert actual == expected, f'project venv runs Python {actual}, matrix expects {expected}'"

      - name: Ruff lint
        run: uv run ruff check src tests scripts --output-format=github

      - name: Ruff format
        run: uv run ruff format --check --respect-gitignore src tests scripts

      - name: Mypy (strict)
        run: uv run mypy src tests scripts

      - name: Pytest (with branch coverage)
        run: |
          uv run pytest -rs \
            --cov=flight_agent_evaluator \
            --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-fail-under=90.00

      - name: Explicit coverage threshold report
        run: uv run coverage report --precision=2 --fail-under=90.00

      - name: Build (wheel + sdist)
        run: uv build

      - name: Inspect wheel
        run: uv run python scripts/check.py wheel

      - name: Inspect sdist
        run: uv run python scripts/check.py sdist

      - name: Isolated wheel installation
        run: uv run python scripts/check.py install-wheel

      - name: Verify package import
        run: uv run python scripts/check.py import

      - name: Verify fixture loading from installed wheel
        run: uv run python scripts/check.py fixtures

      - name: Verify py.typed present
        run: uv run python scripts/check.py pytyped

      - name: Validate README
        run: uv run python scripts/check.py readme

      - name: Reference leakage scanner
        run: uv run python scripts/check.py leakage

      - name: Deterministic fixture smoke test
        run: uv run python scripts/check.py smoke

      - name: Transactional scenario smoke test
        run: uv run python scripts/check.py transactional-smoke

      - name: Benchmark manifest validation
        run: uv run python scripts/check.py manifest

      - name: CLI command verification
        run: uv run python scripts/check.py cli

      - name: Replay integrity verification
        run: uv run python scripts/check.py replay

      - name: Full release verifier
        run: uv run flight-evaluator benchmark verify-release

      - name: Verify committed Benchmark V1 evidence bundle
        run: uv run python scripts/check.py bundle-consistency
